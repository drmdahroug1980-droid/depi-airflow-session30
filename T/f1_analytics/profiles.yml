f1_analytics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('F1_DB_HOST') }}"
      port: "{{ env_var('F1_DB_PORT', '5432') | int }}"
      user: "{{ env_var('F1_DB_USER') }}"
      password: "{{ env_var('F1_DB_PASSWORD') }}"
      dbname: "{{ env_var('F1_DB_NAME') }}"
      schema: analytics
      threads: 4
      connect_timeout: 10
